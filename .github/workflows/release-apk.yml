name: Release APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Unit tests
        run: chmod +x gradlew && ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: printf '%s' "$RELEASE_KEYSTORE_B64" | base64 --decode > /tmp/release.jks

      - name: Build signed release APK
        env:
          CI_VERSION_NAME: 1.0.${{ github.run_number }}
          RELEASE_KEYSTORE_FILE: /tmp/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          export CI_VERSION_CODE=$((10 + GITHUB_RUN_NUMBER))
          ./gradlew --no-daemon :app:assembleRelease

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: 1.0.${{ github.run_number }}
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          OUT="t3-widget-v${VERSION}.apk"
          cp "$APK" "$OUT"
          COMMIT_MSG=$(git log -1 --pretty=%s)
          gh release create "v${VERSION}" "$OUT" \
            --title "v${VERSION}" \
            --notes "Automated release from \`${GITHUB_SHA::7}\`: ${COMMIT_MSG}"

      - name: Cleanup keystore
        if: always()
        run: rm -f /tmp/release.jks
